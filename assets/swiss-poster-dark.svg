<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-label="A Swiss-style typographic poster: Aswin Salish, set in bold on a twelve-column grid beside a red disc and the figure 475, the contributions of the last twelve months, with the year below as 52 weekly bars.">
<style>
.gl{transform-box:fill-box;transform-origin:center top;animation:drop 1.2s cubic-bezier(0.16, 1, 0.3, 1) both}
.slide{animation:slide 1.3s cubic-bezier(0.16, 1, 0.3, 1) both}
.up{animation:up 1.2s cubic-bezier(0.16, 1, 0.3, 1) both}
.disc{transform-box:fill-box;transform-origin:center;animation:disc 1.4s cubic-bezier(0.16, 1, 0.3, 1) .3s both}
.arc{animation:pen 1.4s cubic-bezier(0.16, 1, 0.3, 1) both}
.turn{animation:turn linear infinite}
.t0{animation-duration:48s}.t1{animation-duration:72s;animation-direction:reverse}.t2{animation-duration:110s}
.rule{transform-box:fill-box;transform-origin:left center;animation:wipe 1.2s cubic-bezier(0.16, 1, 0.3, 1) .9s both}
.bar{transform-box:fill-box;transform-origin:50% 100%;animation:grow .9s cubic-bezier(0.16, 1, 0.3, 1) both}
.txt{animation:fade 1s ease-out 1.1s both}
.late{animation:fade 1s ease-out 2s both}
@keyframes drop{from{transform:scaleY(0)}}
@keyframes slide{from{transform:translateX(var(--d))}}
@keyframes up{from{transform:translateY(var(--d))}}
@keyframes disc{from{transform:scale(0)}}
@keyframes pen{from{stroke-dashoffset:1}}
@keyframes turn{to{transform:rotate(360deg)}}
@keyframes wipe{from{transform:scaleX(0)}}
@keyframes grow{from{transform:scaleY(0)}}
@keyframes fade{from{opacity:0}}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }</style>
